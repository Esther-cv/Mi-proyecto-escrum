<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Biblioteca Escolar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 🧭 Encabezado -->
  <header class="main-header">
    <div class="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" alt="Logo" />
      <h1>Mini Biblioteca Escolar</h1>
    </div>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Libros</a>
      <a href="#">Contacto</a>
    </nav>
  </header>

  <!-- 🔍 Buscador -->
  <section class="search-bar">
    <input id="search" type="text" placeholder="Buscar libro, autor o materia...">
  </section>

  <!-- 📚 Contenido principal -->
  <main>
    <section id="booksGrid" class="grid"></section>
  </main>

  <!-- 🧾 Modal para ver PDF -->
  <div id="viewerModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeViewer">Cerrar ✖</button>
      <h2 id="viewerTitle"></h2>
      <iframe id="pdfFrame" src="" frameborder="0"></iframe>
    </div>
  </div>

  <!-- 📜 Pie de página -->
  <footer class="main-footer">
    <p>© 2025 Mini Biblioteca Escolar | Creado para el Colegio</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
